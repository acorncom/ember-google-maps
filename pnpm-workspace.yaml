packages:
  - docs-app
  - ember-google-maps
  - ember-google-maps-directions
  - test-app-*
  - test-addon-*

# v2-addon isolation (from the addon blueprint's own workspace defaults):
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
allowBuilds:
  core-js: false
  esbuild: false

# NOTE: ember-source is deliberately NOT pinned workspace-wide here — no
# `catalog:` and no `overrides:`. Each member declares its own ember-source at
# the package level so an ember-try matrix can rewrite + reinstall them per
# scenario. A catalog/override would force a single version across the workspace
# and fight ember-try's per-package version sweeping.
# OPEN ITEM: keeping the addon and each test-app on the SAME ember-source per
# matrix scenario (mismatched versions -> duplicate Glimmer runtimes -> context
# silently breaks) still needs a wiring decision.

# decorator-transforms override (unrelated to the ember-source policy above):
# several workspace devDependencies (e.g. ember-strict-application-resolver)
# pull in decorator-transforms@2.3.0, which only supports Babel 7. docs-app's
# vite-plugin-ember pipeline runs on @babel/core@8.0.1 (via ember-live-compiler),
# and Babel's own plugin-name resolution for decorator-transforms's
# `module:decorator-transforms` string plugin can pick up that older 2.3.0
# copy instead of the 2.4.0 one vite-plugin-ember actually depends on --
# 2.3.0 then throws "Requires Babel ^7.0.0-0, but was loaded with 8.0.1".
# Forcing a single decorator-transforms line (2.4.0, which supports both
# Babel 7 and 8) removes the ambiguity.
#
# @babel/plugin-transform-typescript override (same bug, different plugin):
# ember-live-compiler passes '@babel/plugin-transform-typescript' to Babel as
# a bare string (for `.gts` compiles), so Babel resolves it itself starting
# from the file being compiled rather than from ember-live-compiler's own
# node_modules. Several workspace devDependencies (the addon's own Babel-7
# build stack) pull in @babel/plugin-transform-typescript@7.29.7, and that
# copy wins the lookup instead of the 8.0.1 copy ember-live-compiler actually
# depends on -- throwing the same "Requires Babel ^7.0.0-0, but was loaded
# with 8.0.1" error, this time for `gts live` docs samples. Forcing a single
# 8.0.1 line removes the ambiguity.
overrides:
  decorator-transforms: ^2.4.0
  '@babel/plugin-transform-typescript': ^8.0.1
