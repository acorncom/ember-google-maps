packages:
  - docs-app
  - ember-google-maps
  - ember-google-maps-directions
  - test-app-*
  - test-addon-*

# v2-addon isolation (from the addon blueprint's own workspace defaults):
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
allowBuilds:
  core-js: false
  esbuild: false

# NOTE: ember-source is deliberately NOT pinned workspace-wide here — no
# `catalog:` and no `overrides:`. Each member declares its own ember-source at
# the package level so an ember-try matrix can rewrite + reinstall them per
# scenario. A catalog/override would force a single version across the workspace
# and fight ember-try's per-package version sweeping.
# OPEN ITEM: keeping the addon and each test-app on the SAME ember-source per
# matrix scenario (mismatched versions -> duplicate Glimmer runtimes -> context
# silently breaks) still needs a wiring decision.

# decorator-transforms override (unrelated to the ember-source policy above):
# several workspace devDependencies (e.g. ember-strict-application-resolver)
# pull in decorator-transforms@2.3.0, which only supports Babel 7. docs-app's
# vite-plugin-ember pipeline runs on @babel/core@8.0.1 (via ember-live-compiler),
# and Babel's own plugin-name resolution for decorator-transforms's
# `module:decorator-transforms` string plugin can pick up that older 2.3.0
# copy instead of the 2.4.0 one vite-plugin-ember actually depends on --
# 2.3.0 then throws "Requires Babel ^7.0.0-0, but was loaded with 8.0.1".
# Forcing a single decorator-transforms line (2.4.0, which supports both
# Babel 7 and 8) removes the ambiguity.
#
# @babel/plugin-transform-typescript patch (same bug shape, different plugin,
# fixed a different way): ember-live-compiler used to pass
# '@babel/plugin-transform-typescript' to Babel as a bare string (for `.gts`
# compiles). Babel resolves bare plugin-name strings itself via
# `require.resolve`/`import-meta-resolve`, and in this workspace that lookup
# is NOT scoped to ember-live-compiler's own dependency graph at all -- it
# reliably lands on whichever @babel/plugin-transform-typescript copy the
# addon's Babel-7 build stack (ember-cli-babel) pulls in, throwing
# "Requires Babel ^7.0.0-0, but was loaded with 8.0.1" for `.gts` compiles
# that must run on Babel 8.
#
# A workspace-wide `overrides` entry "fixes" this but breaks the opposite
# direction: `ember-google-maps`'s own rollup/ember-tsc build needs the
# Babel-7 copy of this same plugin to parse generic class `extends` clauses
# (`typical-map-component.ts`'s `class TypicalMapComponent<S, MapInstance>
# extends MapComponent<S>`); forcing Babel 8's copy onto it breaks
# `pnpm --filter ember-google-maps build` with
# `RollupError: Expected '{', got '<'`.
#
# A `pnpm overrides` "parent>child" selector
# (`ember-live-compiler>@babel/plugin-transform-typescript: ^8.0.1`) looked
# like the right scoping tool -- it does correctly pin ember-live-compiler's
# own lockfile edge -- but does NOT control the actual runtime lookup:
# verified empirically with `DEBUG=babel:config:loading:files:plugins` and a
# `Module._resolveFilename` trace hook that even with that selector in
# place, the docs build still resolved
# `@babel+plugin-transform-typescript@7.29.7_@babel+core@7.26.0` and threw
# the same error. A `packageExtensions` entry pinning the plugin onto
# `@babel/core@8.0.1` specifically was also tried and also didn't change the
# runtime lookup. Both were dead ends -- the ambiguity lives entirely inside
# Babel's own bare-string plugin resolution, which pnpm overrides/extensions
# can't reach.
#
# The fix that actually works: `patches/ember-live-compiler@0.2.4.patch`
# (via `patchedDependencies` below) changes ember-live-compiler's compiled
# output to `import pluginTransformTypescript from
# '@babel/plugin-transform-typescript'` and pass the imported plugin object
# to Babel directly, instead of the bare string. This resolves through
# Node's normal ESM import resolution -- which IS scoped to
# ember-live-compiler's own package.json dependency (`^8.0.1`) -- and
# sidesteps Babel's ambiguous string-based plugin lookup entirely. No
# workspace-wide override or extension needed: the addon's own Babel-7
# build stack is untouched, so `pnpm --filter ember-google-maps build`
# keeps working exactly as before this task.
overrides:
  decorator-transforms: ^2.4.0

patchedDependencies:
  ember-live-compiler@0.2.4: patches/ember-live-compiler@0.2.4.patch
