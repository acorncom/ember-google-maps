# Because this library needs to be built,
# we can't easily point package.json files at the git repo for easy cross-repo testing.
#
# This workflow brings back that capability by placing the compiled assets on a "dist" branch
# (configurable via the "branch" option below)
name: Push dist

on:
  push:
    branches:
      - main
      - master

jobs:
  push-dist:
    name: Push dist
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: acorncom/action-setup-pnpm@91a687c228fac4111cd1be8801ab4c0402752d04 # v4.0.1
        with:
          node-version: '22'
          node-version-file: ''
      - uses: kategengler/put-built-npm-package-contents-on-branch@5b33924ea713bcde29273ef55bac7e4142a7b917 # v2.0.0
        with:
          working-directory: ember-google-maps
          pack-command: pnpm pack
          branch: dist
          token: ${{ secrets.GITHUB_TOKEN }}
